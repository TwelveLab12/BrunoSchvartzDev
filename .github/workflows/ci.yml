name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Un seul job dans ce workflow. L'action Vercel ci-dessous juge le premier job de son run, sans
  # regarder son nom : un second job (comme l'ancien job `a11y`) fausse la porte de mise en
  # production (ADR 0009, #163). Tout autre contrôle va dans son propre workflow (ex. a11y.yml).
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7

      # Reports this job's status to Vercel as a named Deployment Check
      # (Settings > Deployment Checks in the Vercel dashboard).
      - uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - bruno_schvartz_dev: ci"

      - uses: pnpm/action-setup@v6

      # Node : celui de `.nvmrc`, comme sur le poste. Vercel règle le sien à part (réglage du projet,
      # hors du dépôt) : le garder sur la même majeure.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint:ci

      - run: pnpm build
